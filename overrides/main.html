{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <!-- Hide title and reposition image to top-left on About page -->
  {% if "about" in page.url %}
  <style>
    .md-typeset h1 { display: none !important; visibility: hidden !important; height: 0 !important; margin: 0 !important; }
    .md-content__inner h1 { display: none !important; visibility: hidden !important; height: 0 !important; margin: 0 !important; }
    .md-nav__title { display: none !important; }
    .md-content { padding-top: 0 !important; padding-left: 0 !important; padding-right: 0 !important; margin-left: 0 !important; }
    .md-content img:first-of-type { margin: 0 !important; margin-bottom: 30px !important; width: 100% !important; display: block !important; }
  </style>
  {% endif %}

  <!-- SEO: Keywords & Robots -->
  <meta name="keywords" content="technology, azure, cloud, devops, dotnet, csharp, entity framework, async await, blazor, ai agents, rag, llm, mcp servers, api gateway, rest api, microservices, docker, kubernetes, terraform, design patterns, angular, react, nodejs, git, dynatrace">
  <meta name="author" content="Rajkumar">
  <meta name="robots" content="index, follow">
  <meta name="revisit-after" content="7 days">
  <meta name="language" content="English">

  <!-- Open Graph (Facebook / LinkedIn previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:url" content="{% if page and page.canonical_url %}{{ page.canonical_url }}{% else %}{{ config.site_url }}{% endif %}">
  <meta property="og:title" content="{% if page and page.title %}{{ page.title }} – {{ config.site_name }}{% else %}{{ config.site_name }}{% endif %}">
  <meta property="og:description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description }}{% else %}{{ config.site_description }}{% endif %}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page and page.title %}{{ page.title }} – {{ config.site_name }}{% else %}{{ config.site_name }}{% endif %}">
  <meta name="twitter:description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description }}{% else %}{{ config.site_description }}{% endif %}">

  <!-- Canonical URL -->
  {% if page and page.canonical_url %}
  <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ super() }}

  <!-- Display deployment time once (static, not ticking) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Find and update timestamp in blockquote
      const blockquotes = document.querySelectorAll('blockquote');
      blockquotes.forEach(bq => {
        if (bq.textContent.includes('[Timestamp will load]')) {
          const now = new Date();
          const nzTime = now.toLocaleString('en-NZ', {
            timeZone: 'Pacific/Auckland',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true,
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          });
          bq.innerHTML = bq.innerHTML.replace('[Timestamp will load]', nzTime + ' (New Zealand Time)');
        }
      });
    });
  </script>

  <!-- Remove About Me label and make image full-width on About page -->
  {% if "about" in page.url %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        // Find and remove ANY element containing "About Me" text
        var allElements = document.querySelectorAll('*');
        allElements.forEach(function(el) {
          if (el.textContent.trim() === 'About Me' && el.className.includes('nav')) {
            el.remove();
          }
        });

        // Remove .md-nav__title elements
        document.querySelectorAll('.md-nav__title').forEach(el => el.remove());

        // Position image on left side
        var img = document.querySelector('.md-content img:first-of-type');
        if (img) {
          img.style.float = 'left';
          img.style.width = '400px';
          img.style.marginRight = '30px';
          img.style.marginBottom = '20px';
          img.style.marginTop = '0';
        }
      }, 100);
    });
  </script>
  {% endif %}
{% endblock %}
