site_name: Raj's Tech Hub
site_description: Personal technology learning hub by Rajkumar
site_author: Rajkumar
site_url: https://rajkumar611.github.io/TechHub

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: blue
    accent: light blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/credit.js

nav:
  - About Me: about.md
  - AI:
    - 00_INDEX_AND_LEARNING_PATH: 01_AI/00_INDEX_AND_LEARNING_PATH.md
    - 01_What_is_AI: 01_AI/01_What_is_AI.md
    - 02_What_is_Machine_Learning: 01_AI/02_What_is_Machine_Learning.md
    - 03_Deep_Learning_and_Neural_Networks: 01_AI/03_Deep_Learning_and_Neural_Networks.md
    - 04_Forward_and_Backward_Propagation: 01_AI/04_Forward_and_Backward_Propagation.md
    - 05_Attention_Mechanism: 01_AI/05_Attention_Mechanism.md
    - 06_Transformer_Architecture: 01_AI/06_Transformer_Architecture.md
    - 07_Large_Language_Models: 01_AI/07_Large_Language_Models.md
    - 08_Prompt_Engineering: 01_AI/08_Prompt_Engineering.md
    - 09_Retrieval_Augmented_Generation: 01_AI/09_Retrieval_Augmented_Generation.md
    - 10_Agents_and_Agentic_AI: 01_AI/10_Agents_and_Agentic_AI.md
    - 11_LangChain_LangGraph_Frameworks: 01_AI/11_LangChain_LangGraph_Frameworks.md
    - 12_Evals_Responsible_AI: 01_AI/12_Evals_Responsible_AI.md
    - 13_Model_Context_Protocol_MCP: 01_AI/13_Model_Context_Protocol_MCP.md
  - Cloud:
    - Akamai_CDN: 02_Cloud/Akamai_CDN.md
    - Azure_Functions_vs_App_Service: 02_Cloud/Azure_Functions_vs_App_Service.md
    - Azure_Service_Principal_vs_Managed_Identity: 02_Cloud/Azure_Service_Principal_vs_Managed_Identity.md
    - Containers_Docker_Kubernetes: 02_Cloud/Containers_Docker_Kubernetes.md
    - Infrastructure_as_Code_Terraform_Bicep_ARM: 02_Cloud/Infrastructure_as_Code_Terraform_Bicep_ARM.md
  - DotNet:
    - Application_Pool_and_IIS: 03_DotNet/Application_Pool_and_IIS.md
    - Async_Await: 03_DotNet/Async_Await.md
    - Async_vs_Multithreading: 03_DotNet/Async_vs_Multithreading.md
